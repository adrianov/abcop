# Publish abcop to crates.io and GitHub Releases when a version tag is pushed
# (e.g. v0.16.6). Requires repository secret CARGO_REGISTRY_TOKEN.
#
# workflow_dispatch re-runs publish for an existing tag (crates.io retry /
# asset refresh) without retagging — use after setting CARGO_REGISTRY_TOKEN.
#
# The .deb is built on Ubuntu 22.04 (glibc 2.35) so it installs on Ubuntu
# 22.04/24.04 LTS and Debian bookworm/trixie (and other Debian-like amd64).
# macOS .tar.gz archives ship the binary and man page for Apple Silicon and Intel.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)publish, e.g. v0.16.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Require CARGO_REGISTRY_TOKEN
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty. Add a crates.io API token at Settings → Secrets → Actions, then re-run this job or workflow_dispatch."
            exit 1
          fi
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # Build on Jammy so the binary's glibc requirement stays at 2.35 (not Noble's
  # newer symbols), which keeps Ubuntu 22.04+ and current Debian installable.
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --locked
      - name: Smoke-test .deb install
        run: |
          set -euo pipefail
          deb=(target/debian/*.deb)
          sudo dpkg -i "${deb[0]}"
          abcop --help >/dev/null
          man -w abcop
          dpkg -L abcop | grep -E '/usr/bin/abcop|/usr/share/man/man1/abcop\.1'
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: abcop-deb
          path: target/debian/*.deb

  # Both Apple targets on macos-14 (arm64 host can link x86_64-apple-darwin).
  tarball:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack .tar.gz
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          stage="abcop-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/abcop" "$stage/abcop"
          cp man/abcop.1 "$stage/abcop.1"
          tar -czf "${stage}.tar.gz" "$stage"
          mkdir -p dist
          mv "${stage}.tar.gz" dist/
      - name: Upload .tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: abcop-tarball-${{ matrix.target }}
          path: dist/*.tar.gz

  github-release:
    needs: [deb, tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: abcop-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          shopt -s nullglob
          assets=(dist/*)
          test "${#assets[@]}" -gt 0

          deb_name=""
          for f in "${assets[@]}"; do
            case "$f" in
              *.deb) deb_name=$(basename "$f") ;;
            esac
          done

          notes="## Install

          ### macOS (binary + man)

          Apple Silicon:
          \`\`\`sh
          curl -LO https://github.com/adrianov/abcop/releases/download/${tag}/abcop-${version}-aarch64-apple-darwin.tar.gz
          tar -xzf abcop-${version}-aarch64-apple-darwin.tar.gz
          sudo cp abcop-${version}-aarch64-apple-darwin/abcop /usr/local/bin/
          sudo mkdir -p /usr/local/share/man/man1
          sudo cp abcop-${version}-aarch64-apple-darwin/abcop.1 /usr/local/share/man/man1/
          \`\`\`

          Or via Homebrew: \`brew install adrianov/abcop/abcop\`.

          ### Ubuntu / Debian (amd64)

          Works on **Ubuntu 22.04+** and **Debian bookworm+**.

          \`\`\`sh
          curl -LO https://github.com/adrianov/abcop/releases/download/${tag}/${deb_name}
          sudo dpkg -i ${deb_name}
          \`\`\`

          Also available via crates.io: \`cargo install abcop\`."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "abcop $version" \
              --notes "$notes"
          fi

  # Official MCP Registry listing (crates.io ownership via README mcp-name:).
  # Runs after crates.io so the version README is already public for verification.
  mcp-registry:
    needs: [crates-io]
    if: needs.crates-io.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Sync server.json version from tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          jq --arg v "$version" \
            '.version = $v | .packages[].version = $v' \
            server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
