# Publish abcop to crates.io and GitHub Releases when a version tag is pushed
# (e.g. v0.16.2). Requires repository secret CARGO_REGISTRY_TOKEN.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --locked
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: abcop-deb
          path: target/debian/*.deb

  github-release:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: abcop-deb
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          deb=(dist/*.deb)
          name=$(basename "${deb[0]}")
          gh release create "$GITHUB_REF_NAME" "${deb[@]}" \
            --title "abcop $version" \
            --notes "## Install (Debian / Ubuntu)

          \`\`\`sh
          curl -LO https://github.com/adrianov/abcop/releases/download/${GITHUB_REF_NAME}/${name}
          sudo dpkg -i ${name}
          \`\`\`

          Installs \`/usr/bin/abcop\` and the \`abcop(1)\` man page.

          Also available via crates.io: \`cargo install abcop\`."
