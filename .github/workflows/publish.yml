# Publish abcop to crates.io when a version tag is pushed (e.g. v0.16.0).
# Requires repository secret CARGO_REGISTRY_TOKEN (crates.io API token).
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
