[package]
name = "abcop"
version = "0.1.1"
edition = "2024"
authors = ["Peter Adrianov"]
license = "GPL-3.0-or-later"
repository = "https://github.com/adrianov/abcop"
description = "Blazing-fast multi-language ABC-size and used-once-variable linter"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-ruby = { path = "vendor/tree-sitter-ruby" }
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
tree-sitter-javascript = { path = "vendor/tree-sitter-javascript" }
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
tree-sitter-objc = { path = "vendor/tree-sitter-objc" }
sha2 = "0.10"
memmap2 = "0.9"
tree-sitter-c = { path = "vendor/tree-sitter-c" }
tree-sitter-swift = { path = "vendor/tree-sitter-swift" }
tree-sitter-python = { path = "vendor/tree-sitter-python" }
redb = "4.2"
tree-sitter-go = { path = "vendor/tree-sitter-go" }
tree-sitter-php = { path = "vendor/tree-sitter-php" }
tree-sitter-java = { path = "vendor/tree-sitter-java" }
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp" }
tree-sitter-solidity = { path = "vendor/tree-sitter-solidity" }


[profile.release]
lto = true
codegen-units = 1
