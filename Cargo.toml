[package]
name = "abcop"
version = "0.1.1"
edition = "2024"
authors = ["Peter Adrianov"]
license = "GPL-3.0-or-later"
repository = "https://github.com/adrianov/abcop"
description = "Blazing-fast multi-language ABC-size and used-once-variable linter"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-objc = "3"
sha2 = "0.10"
memmap2 = "0.9"
tree-sitter-c = "0.23"
tree-sitter-swift = "0.7.3"


[profile.release]
lto = true
codegen-units = 1
